$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Stock Count.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/stock-counts/{{stock_count_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "notes": "Updated notes",
      "count_date": "2026-06-29"
    }
