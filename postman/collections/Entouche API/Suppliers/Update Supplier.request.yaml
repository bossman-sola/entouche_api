$kind: http-request
name: Update Supplier
order: 4000
method: PUT
url: '{{base_url}}/v1/suppliers/{{supplier_id}}'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Corp Updated",
      "code": "ACME",
      "email": "contact@acme.com",
      "phone": "+1234567890",
      "address": "456 Supplier Ave",
      "status": "active"
    }
