$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Supplier.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/suppliers/{{supplier_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Corp Updated",
      "code": "ACME",
      "email": "contact@acme.com",
      "phone": "+1234567890",
      "address": "456 Supplier Ave",
      "status": "inactive"
    }
