$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Create Supplier.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/suppliers"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Corp",
      "code": "ACME",
      "email": "contact@acme.com",
      "phone": "+1234567890",
      "address": "456 Supplier Ave",
      "status": "active"
    }
