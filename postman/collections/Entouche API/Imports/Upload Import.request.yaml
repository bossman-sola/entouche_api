$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Upload Import.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/imports"
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - postman-cloud:///1f1a9485-bdbf-4fc0-bad2-37453d4a0b61
      description: CSV/XLSX/XLS file to import
      disabled: false
    - type: text
      key: import_type
      value: inventory
      description: "Type of import: items or inventory"
      disabled: false
    - type: text
      key: warehouse_id
      value: "1"
      description: ""
      disabled: false
