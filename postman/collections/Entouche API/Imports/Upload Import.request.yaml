$kind: http-request
name: Upload Import
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Upload Import.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/imports"
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - postman-cloud:///1f18c765-ec2a-4480-bd6f-a8f324e759b0
      description: CSV/XLSX/XLS file to import
      disabled: false
    - type: text
      key: import_type
      value: items
      description: "Type of import: items or inventory"
      disabled: false
    - type: text
      key: warehouse_id
      value: "1"
      description: ""
      disabled: false
