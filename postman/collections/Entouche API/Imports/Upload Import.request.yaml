$kind: http-request
name: Upload Import
order: 2000
method: POST
url: '{{base_url}}/v1/imports'
headers:
  - key: Accept
    value: application/json
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
      description: 'CSV/XLSX/XLS file to import'
    - key: import_type
      type: text
      value: items
      description: 'Type of import: items or inventory'
