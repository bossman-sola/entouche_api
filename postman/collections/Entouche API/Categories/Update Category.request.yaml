$kind: http-request
name: Update Category
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Category.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/categories/{{category_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Electronics",
      "code": "ELEC",
      "status": "active"
    }
