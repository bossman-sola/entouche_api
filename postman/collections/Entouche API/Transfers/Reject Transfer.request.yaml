$kind: http-request
name: Reject Transfer
order: 8000
method: POST
url: '{{base_url}}/v1/transfers/{{transfer_id}}/reject'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Insufficient stock"
    }
