$kind: http-request
name: Reject Transfer
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Reject Transfer.resources/examples
order: 8000
method: POST
url: "{{base_url}}/api/v1/transfers/{{transfer_id}}/reject"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Insufficient stock"
    }
