$kind: http-request
name: Create Transfer
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Create Transfer.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/transfers"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "from_warehouse_id": 1,
      "from_location_id": 1,
      "to_warehouse_id": 1,
      "to_location_id": 2,
      "notes": "Move from Receiving Area to Storage Area",
      "items": [
        {"item_id": 3, "quantity": 50}
      ]
    }
