$kind: http-request
name: Update Transfer
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Transfer.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/transfers/{{transfer_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "notes": "Updated transfer notes",
      "from_location_id": 1,
      "items": [
        {"item_id": 6, "warehouse_location_id": 2, "quantity": 60, "unit_cost": 25.00}
      ]
    }
