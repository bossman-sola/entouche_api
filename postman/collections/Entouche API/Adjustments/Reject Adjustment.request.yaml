$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Reject Adjustment.resources/examples
order: 8000
method: POST
url: "{{base_url}}/api/v1/adjustments/{{adjustment_id}}/reject"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Incorrect quantities"
    }
