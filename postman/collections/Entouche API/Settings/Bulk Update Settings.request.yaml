$kind: http-request
name: Bulk Update Settings
order: 2000
method: PUT
url: '{{base_url}}/v1/settings'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "settings": [
        {"key": "numbering.receipt_prefix", "value": "RCPT"},
        {"key": "numbering.transfer_prefix", "value": "TRF"}
      ]
    }
