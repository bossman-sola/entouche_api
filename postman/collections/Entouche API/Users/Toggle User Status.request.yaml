$kind: http-request
body:
  type: json
  content: |-
    {
      "status": "inactive"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Toggle User Status.resources/examples
order: 8000
method: POST
url: "{{base_url}}/api/v1/users/{{user_id}}/toggle-status"
headers:
  Accept: application/json
