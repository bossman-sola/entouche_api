$kind: http-request
name: Update User
order: 4000
method: PUT
url: '{{base_url}}/v1/users/{{user_id}}'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe Updated",
      "email": "john@example.com",
      "phone": "+1234567890",
      "status": "active"
    }
