$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Remove Role.resources/examples
order: 7000
method: POST
url: "{{base_url}}/api/v1/users/{{user_id}}/remove-role"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "inventory_officer"
    }
