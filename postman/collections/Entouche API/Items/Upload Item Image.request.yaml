$kind: http-request
name: Upload Item Image
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Upload Item Image.resources/examples
order: 6000
method: POST
url: "{{base_url}}/api/v1/items/{{item_id}}/image"
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
      description: ""
      disabled: false
