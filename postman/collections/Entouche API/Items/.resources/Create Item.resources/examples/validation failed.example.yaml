      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Widget A",
        "unit_of_measure_id": 1,
        "category_id": 1,
        "supplier_id": 1,
        "barcode": "1234567890",
        "item_type": "product",
