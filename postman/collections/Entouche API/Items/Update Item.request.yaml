$kind: http-request
name: Update Item
order: 4000
method: PUT
url: '{{base_url}}/v1/items/{{item_id}}'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Widget A Updated",
      "unit_cost": 12.00,
      "selling_price": 18.00,
      "reorder_level": 15
    }
