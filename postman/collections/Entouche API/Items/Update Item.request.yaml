$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Item.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/items/{{item_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Widget A Updated",
      "unit_cost": 12.00,
      "selling_price": 18.00,
      "reorder_level": 15
    }
