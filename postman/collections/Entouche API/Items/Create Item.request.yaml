$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Create Item.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/items"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Widget A",
      "unit_of_measure_id": 1,
      "category_id": 1,
      "supplier_id": 1,
      "barcode": "1234567890",
      "item_type": "product",
      "brand": "BrandX",
      "description": "A sample widget",
      "unit_cost": 10.00,
      "selling_price": 15.00,
      "reorder_level": 10,
      "status": "active"
    }
