$kind: http-request
name: Update Unit
order: 4000
method: PUT
url: '{{base_url}}/v1/units/{{unit_id}}'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Kilogram",
      "abbreviation": "kg",
      "status": "active"
    }
