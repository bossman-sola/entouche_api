$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Update Unit.resources/examples
order: 4000
method: PUT
url: "{{base_url}}/api/v1/units/{{unit_id}}"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Kilogram",
      "abbreviation": "kg",
      "status": "inactive"
    }
