$kind: http-request
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
examples: .resources/Create Warehouse.resources/examples
order: 2000
method: POST
url: "{{base_url}}/api/v1/warehouses"
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Secondary Warehouse",
      "code": "WH-002",
      "address": "123 Main St",
      "status": "active"
    }
